<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>电雷像素化</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>电雷像素化</h1>
        <p>本地工具。参考 PNG 只作为输入，导出的网格才是游戏会导入的像素。</p>
      </header>
      <section class="controls">
        <div class="row">
          <label>
            PNG
            <input id="file" type="file" accept="image/png,.png" />
          </label>
          <button id="fixture" type="button">载入示例</button>
        </div>
        <label>
          目标宽
          <input id="tw" type="number" min="1" max="512" value="32" />
        </label>
        <label>
          目标高
          <input id="th" type="number" min="1" max="512" value="32" />
        </label>
        <label>
          取样
          <select id="sample">
            <option value="nearest">nearest</option>
            <option value="box">box</option>
          </select>
        </label>
        <label>
          量化
          <select id="quantize">
            <option value="nearest">nearest</option>
            <option value="dither">dither</option>
          </select>
        </label>
        <label>
          透明阈值
          <input id="alpha" type="number" min="0" max="255" value="0" />
        </label>
        <label>
          抖动强度
          <input id="dither" type="number" min="0" max="1" step="0.05" value="1" />
        </label>
        <button id="export" type="button" disabled>导出 .grid.json</button>
        <p id="status">载入一张 PNG。</p>
        <fieldset disabled>
          <legend>P1 装配</legend>
          <p>关卡、受击部件和轴心不在这一版。</p>
        </fieldset>
      </section>
      <section class="preview">
        <canvas id="view" width="8" height="8"></canvas>
      </section>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
