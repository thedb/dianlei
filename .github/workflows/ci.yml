name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build H5
        run: npm run build:h5

      - name: Verify relative asset paths
        run: |
          # Fail if index.html contains absolute asset paths (would 404 when deployed to a subfolder)
          if grep -E '(src|href)="/assets' dist/index.html; then
            echo "::error::dist/index.html contains absolute asset paths (src=\"/assets or href=\"/assets)."
            echo "::error::Assets must use relative paths (./assets/) for deployment flexibility."
            exit 1
          fi
          echo "✓ All asset paths are relative"

          # Vite copies public/ into dist/. These names are not hashed, and the
          # boot cover, title mark, and Fusion Pixel fallback 404 if they are missing.
          for f in \
            dist/ui/boot-cover.jpg \
            dist/ui/title-mark.jpg \
            dist/fonts/fusion-pixel-12px-proportional-zh_hans.woff2
          do
            if [ ! -f "$f" ]; then
              echo "::error::missing $f (public/ must be copied into dist/)"
              exit 1
            fi
          done
          echo "✓ Shell cover, title mark, and title font are in dist/"

      - name: Build WeChat (type check only)
        run: npm run build:wx

      - name: Upload H5 build artifact
        uses: actions/upload-artifact@v4
        with:
          name: h5-dist
          path: dist/
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    needs: lint-test-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build H5 for production
        run: npm run build:h5
        env:
          ASSET_BASE_URL: 'https://cdn.it-consultis.com/vibeCoding/dianlei/assets/'

      - name: Install ossutil
        run: |
          curl -fsSL https://gosspublic.alicdn.com/ossutil/install.sh | sudo bash

      - name: Configure ossutil
        run: |
          ossutil config -e oss-cn-shanghai.aliyuncs.com -i ${{ secrets.OSS_ACCESS_KEY_ID }} -k ${{ secrets.OSS_ACCESS_KEY_SECRET }}

      - name: Deploy to Aliyun OSS
        run: |
          # Upload hashed assets with long cache (immutable, 1 year)
          # Content-hashed filenames mean the URL changes when content changes
          ossutil cp -r dist/assets/ oss://it-consultis/vibeCoding/dianlei/h5/assets/ \
            --meta "Cache-Control:public, max-age=31536000, immutable" \
            --update \
            --jobs 10

          # Always upload index.html (no --update) with no-cache
          # This ensures new deployments are immediately visible
          ossutil cp dist/index.html oss://it-consultis/vibeCoding/dianlei/h5/index.html \
            --meta "Cache-Control:no-cache" \
            --force

          # public/ copies (ui/, fonts/) keep stable names, so they must be
          # replaced on every deploy. One-day cache, not the hashed immutable year.
          for f in \
            dist/ui/boot-cover.jpg \
            dist/ui/title-mark.jpg \
            dist/fonts/fusion-pixel-12px-proportional-zh_hans.woff2
          do
            if [ ! -f "$f" ]; then
              echo "::error::missing $f; refusing to deploy without shell files"
              exit 1
            fi
          done
          ossutil cp -r dist/ui/ oss://it-consultis/vibeCoding/dianlei/h5/ui/ \
            --meta "Cache-Control:public, max-age=86400" \
            --force \
            --jobs 10
          ossutil cp -r dist/fonts/ oss://it-consultis/vibeCoding/dianlei/h5/fonts/ \
            --meta "Cache-Control:public, max-age=86400" \
            --force \
            --jobs 10

      - name: Output deploy URL
        run: |
          echo "::notice::Deployed to https://cdn.it-consultis.com/vibeCoding/dianlei/h5/index.html"
